<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover">
<meta name="theme-color" content="#060813">
<title>Nino · JEE Doubts Solved Instantly</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2040%2040%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%236366f1%22/%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%2338bdf8%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect%20width%3D%2240%22%20height%3D%2240%22%20rx%3D%2212%22%20fill%3D%22url%28%23g%29%22/%3E%3Cellipse%20cx%3D%2220%22%20cy%3D%2220%22%20rx%3D%2213.5%22%20ry%3D%225.4%22%20transform%3D%22rotate%28-32%2020%2020%29%22%20fill%3D%22none%22%20stroke%3D%22%23fff%22%20stroke-width%3D%222.2%22/%3E%3Ccircle%20cx%3D%2220%22%20cy%3D%2220%22%20r%3D%223.7%22%20fill%3D%22%23fff%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

<style>
@property --ang{syntax:'<angle>';initial-value:0deg;inherits:false}
:root{
  color-scheme: dark;
  --bg: #060813;
  --card: rgba(18, 24, 43, 0.65);
  --tx: #f8fafc;
  --mu: rgba(226, 232, 240, 0.7);
  --dm: rgba(226, 232, 240, 0.4);
  --gb: rgba(255, 255, 255, 0.08);
  --gb-focus: rgba(99, 102, 241, 0.4);
  --hi: rgba(255, 255, 255, 0.15);
  
  /* Focus Accents */
  --indigo: #6366f1;
  --cyan: #38bdf8;
  --emerald: #10b981;
  --amber: #f59e0b;
  --rose: #f43f5e;
  
  --spring: cubic-bezier(0.16, 1, 0.3, 1);
  --sans: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  --mono: 'JetBrains Mono', monospace;
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--tx);font:16px/1.6 var(--sans);overflow:hidden;letter-spacing:-0.012em}
button,input,textarea{font:inherit;color:inherit;background:none;border:0;outline:0}
button{cursor:pointer;user-select:none}
.hidden{display:none!important}

/* Atmospheric Glow Background */
#glow-bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#glow-bg:before{
  content:'';position:absolute;width:600px;height:450px;top:20%;left:50%;transform:translate(-50%,-50%);
  background:radial-gradient(circle,rgba(99,102,241,0.18) 0%,rgba(56,189,248,0.08) 40%,transparent 70%);
  filter:blur(80px);
}

/* App Shell */
#app{position:relative;z-index:1;display:flex;height:100dvh;padding:12px;gap:12px}

/* Minimalist Sidebar */
#sidebar{
  width:280px;flex-shrink:0;border-radius:24px;background:rgba(10,14,28,0.75);
  border:1px solid var(--gb);display:flex;flex-direction:column;z-index:50;
  backdrop-filter:blur(24px);box-shadow:0 20px 40px rgba(0,0,0,0.4);
  transition:transform .4s var(--spring);
}
.sb-header{height:64px;padding:0 18px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px}
.brand .logo{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,#6366f1,#38bdf8);display:grid;place-items:center}
.brand .badge{font-size:10px;font-weight:700;padding:2px 6px;border-radius:6px;background:rgba(56,189,248,0.15);color:var(--cyan);letter-spacing:0.04em}

.new-chat-btn{
  margin:4px 14px 12px;padding:11px 16px;border-radius:14px;
  background:rgba(255,255,255,0.04);border:1px solid var(--gb);
  display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;
  transition:all .2s;
}
.new-chat-btn:hover{background:rgba(255,255,255,0.08);border-color:var(--hi)}
#history{flex:1;overflow-y:auto;padding:0 10px;scrollbar-width:none}
.hist-item{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:10px 14px;border-radius:12px;color:var(--mu);font-size:14px;cursor:pointer;
  transition:all .2s;margin-bottom:2px;
}
.hist-item:hover{background:rgba(255,255,255,0.05);color:var(--tx)}
.hist-item.active{background:rgba(99,102,241,0.15);color:var(--tx);font-weight:600;border:1px solid rgba(99,102,241,0.3)}
.hist-item .del{opacity:0;transition:opacity .2s;color:var(--rose)}
.hist-item:hover .del{opacity:0.8}

.sb-footer{padding:12px;border-top:1px solid var(--gb);display:flex;gap:6px}
.sb-footer button{flex:1;height:40px;border-radius:10px;background:rgba(255,255,255,0.03);font-size:13px;font-weight:600;color:var(--mu)}
.sb-footer button:hover{background:rgba(255,255,255,0.07);color:var(--tx)}

/* Main Canvas */
#main-area{flex:1;display:flex;flex-direction:column;position:relative;min-width:0}

/* Top Navbar with Dynamic Island */
#navbar{
  height:60px;display:flex;align-items:center;justify-content:space-between;
  padding:0 10px;position:relative;z-index:30;
}
.icon-btn{
  width:42px;height:42px;border-radius:12px;display:grid;place-items:center;
  background:rgba(255,255,255,0.04);border:1px solid var(--gb);
  color:var(--mu);transition:all .2s;
}
.icon-btn:hover{background:rgba(255,255,255,0.08);color:var(--tx)}
#menu-toggle{display:none}

/* Apple Dynamic Island */
.island-wrap{position:absolute;left:50%;top:8px;transform:translateX(-50%);z-index:40}
.dynamic-island{
  display:inline-flex;align-items:center;gap:10px;height:44px;padding:0 18px;border-radius:999px;
  background:#090d1a;border:1px solid var(--gb);box-shadow:0 8px 32px rgba(0,0,0,0.5);
  font-size:13.5px;font-weight:600;white-space:nowrap;transition:all .45s var(--spring);
}
.island-dot{width:7px;height:7px;border-radius:50%;background:var(--emerald);box-shadow:0 0 8px var(--emerald)}
.bars{display:none;align-items:center;gap:2.5px;height:14px}
.bars b{width:3px;border-radius:2px;background:var(--cyan);animation:eq .9s ease-in-out infinite;height:5px}
.bars b:nth-child(2){animation-delay:.15s}.bars b:nth-child(3){animation-delay:.3s}
@keyframes eq{50%{height:14px;background:var(--indigo)}}
.dynamic-island.busy{border-color:rgba(56,189,248,0.4);box-shadow:0 0 24px rgba(56,189,248,0.25)}
.dynamic-island.busy .island-dot{display:none}
.dynamic-island.busy .bars{display:flex}

/* 2-Second Clear Home Stage */
#home-stage{
  flex:1;overflow-y:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:20px;max-width:740px;margin:0 auto;width:100%;
}
.hero-badge{
  display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;
  background:rgba(255,255,255,0.05);border:1px solid var(--gb);font-size:13px;font-weight:600;
  color:var(--cyan);margin-bottom:20px;
}
.hero-title{font-size:clamp(36px,5.5vw,56px);font-weight:800;letter-spacing:-0.04em;line-height:1.1;margin-bottom:12px}
.hero-title span{background:linear-gradient(135deg,#38bdf8,#6366f1);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero-desc{font-size:clamp(15px,2vw,17px);color:var(--mu);max-width:520px;line-height:1.5;margin-bottom:32px}

/* Central Hero Input Hub */
.hero-input-hub{width:100%;max-width:680px;position:relative}
.input-capsule{
  position:relative;border-radius:24px;background:rgba(15,21,38,0.7);
  border:1px solid var(--gb);box-shadow:0 16px 40px -10px rgba(0,0,0,0.6),inset 0 1px 0 var(--hi);
  backdrop-filter:blur(30px);transition:border-color .3s,box-shadow .3s;padding:12px;
}
.input-capsule:focus-within{border-color:var(--gb-focus);box-shadow:0 20px 48px -10px rgba(99,102,241,0.25)}
.textarea-row{display:flex;align-items:flex-start;gap:10px}
#user-textarea{
  flex:1;max-height:140px;padding:8px 6px;font-size:16px;line-height:1.5;
  color:#fff;resize:none;scrollbar-width:none;
}
#user-textarea::placeholder{color:var(--dm)}
.action-row{display:flex;align-items:center;justify-content:space-between;margin-top:10px;padding-top:10px;border-top:1px solid var(--gb)}
.left-actions{display:flex;align-items:center;gap:8px}
.pill-btn{
  display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:999px;
  background:rgba(255,255,255,0.05);border:1px solid var(--gb);font-size:13px;font-weight:600;
  color:var(--mu);transition:all .2s;
}
.pill-btn:hover{background:rgba(255,255,255,0.1);color:var(--tx)}
.pill-btn.active{background:rgba(56,189,248,0.15);border-color:rgba(56,189,248,0.3);color:var(--cyan)}
.submit-btn{
  width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#6366f1,#38bdf8);
  display:grid;place-items:center;color:#fff;transition:transform .2s var(--spring),opacity .2s;
}
.submit-btn.disabled{opacity:0.3;pointer-events:none;transform:scale(0.92)}

/* 3 Quick Jump Cards */
.quick-picks{display:flex;gap:10px;justify-content:center;margin-top:20px;flex-wrap:wrap}
.quick-chip{
  padding:8px 16px;border-radius:12px;background:rgba(255,255,255,0.03);border:1px solid var(--gb);
  font-size:13px;font-weight:600;color:var(--mu);transition:all .2s;
}
.quick-chip:hover{background:rgba(255,255,255,0.08);color:var(--tx);transform:translateY(-1px)}

/* Chat Message Window */
#chat-stage{flex:1;overflow-y:auto;padding:20px 16px;max-width:800px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:20px;scrollbar-width:none}
.msg{display:flex;width:100%;animation:fadeIn .3s var(--spring)}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.msg.user{justify-content:flex-end}
.msg.user .bubble{
  max-width:80%;padding:12px 18px;border-radius:20px 20px 4px 20px;
  background:linear-gradient(135deg,#4f46e5,#6366f1);color:#fff;font-size:15.5px;
  box-shadow:0 4px 16px rgba(79,70,229,0.3);
}
.msg.ai{gap:12px;align-items:flex-start}
.msg.ai .avatar{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,#6366f1,#38bdf8);display:grid;place-items:center;flex-shrink:0}
.ai-content{flex:1;min-width:0;font-size:16px;line-height:1.7}
.ai-content p{margin-bottom:12px}.ai-content p:last-child{margin:0}
.ai-content h1,.ai-content h2,.ai-content h3{margin:16px 0 8px;font-weight:700}
.ai-content ul,.ai-content ol{padding-left:20px;margin-bottom:12px}
.ai-content code{font-family:var(--mono);font-size:0.9em;background:rgba(255,255,255,0.08);padding:2px 6px;border-radius:6px}
.ai-content pre{background:rgba(0,0,0,0.5);border:1px solid var(--gb);border-radius:16px;padding:14px;overflow-x:auto;margin:12px 0}

/* Persistent Bottom Capsule (Visible during active chat) */
#bottom-bar{padding:10px;max-width:800px;margin:0 auto;width:100%}

/* Test Split Slide-In Drawer */
#test-drawer{
  position:fixed;right:0;top:0;bottom:0;width:480px;background:rgba(12,16,32,0.92);
  border-left:1px solid var(--gb);box-shadow:-20px 0 50px rgba(0,0,0,0.7);
  z-index:100;backdrop-filter:blur(36px);display:flex;flex-direction:column;
  transform:translateX(100%);transition:transform .4s var(--spring);
}
#test-drawer.open{transform:translateX(0)}
.td-head{height:64px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--gb)}
.td-timer{font-family:var(--mono);font-weight:700;color:var(--amber);background:rgba(245,158,11,0.15);padding:4px 12px;border-radius:999px;font-size:13.5px}
#test-body{flex:1;overflow-y:auto;padding:20px;scrollbar-width:none}
.test-q-card{padding:18px;border-radius:18px;background:rgba(255,255,255,0.03);border:1px solid var(--gb);margin-bottom:16px}
.td-opt{
  display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:12px;
  background:rgba(255,255,255,0.02);border:1px solid var(--gb);margin-top:8px;cursor:pointer;transition:all .2s;
}
.td-opt:hover{background:rgba(255,255,255,0.06)}
.td-opt.selected{border-color:var(--indigo);background:rgba(99,102,241,0.15)}

@media(max-width:768px){
  #sidebar{position:fixed;inset:10px auto 10px 10px;width:min(85vw,300px);transform:translateX(-120%)}
  #sidebar.open{transform:translateX(0)}
  #menu-toggle{display:grid}
  #test-drawer{width:100%}
}
</style>
</head>

<body>
<div id="glow-bg"></div>
<div id="app">

  <!-- Minimal Sidebar -->
  <aside id="sidebar">
    <div class="sb-header">
      <div class="brand">
        <div class="logo">⚡</div>
        <span>Nino</span>
        <span class="badge">JEE 2.0</span>
      </div>
      <button class="icon-btn" onclick="toggleSidebar()" style="width:34px;height:34px">✕</button>
    </div>
    <button class="new-chat-btn" onclick="startFreshChat()">
      <span style="font-size:16px">+</span> New Doubt Session
    </button>
    <div id="history"></div>
    <div class="sb-footer">
      <button onclick="alert('Target: Top 500 in JEE Advanced. Daily accuracy tracking active.')">🎯 Targets</button>
      <button onclick="startFreshChat()">🗑️ Reset</button>
    </div>
  </aside>

  <!-- Main View -->
  <main id="main-area">
    <!-- Navbar with Apple Dynamic Island -->
    <header id="navbar">
      <button class="icon-btn" id="menu-toggle" onclick="toggleSidebar()">☰</button>
      
      <!-- Center Dynamic Island -->
      <div class="island-wrap">
        <div class="dynamic-island" id="island">
          <span class="island-dot"></span>
          <div class="bars"><b></b><b></b><b></b></div>
          <span id="island-text">Nino · Ready for your doubt</span>
        </div>
      </div>

      <button class="icon-btn" onclick="startFreshChat()" title="New Chat">✎</button>
    </header>

    <!-- 2-Second Clean Home Screen -->
    <section id="home-stage">
      <div class="hero-badge">⚡ IIT-JEE Physics, Chemistry & Maths</div>
      <h1 class="hero-title">Your JEE doubts, <span>solved in seconds.</span></h1>
      <p class="hero-desc">Ask any complex equation, reaction mechanism, or snap a photo of your module.</p>

      <!-- The Central Hero Capsule -->
      <div class="hero-input-hub">
        <div class="input-capsule">
          <input type="file" id="file-picker" accept="image/*,.pdf" class="hidden" onchange="onFilePicked()">
          <div class="textarea-row">
            <textarea id="user-textarea" rows="1" placeholder="Type a concept, paste a problem, or ask for a test…"></textarea>
          </div>
          <div class="action-row">
            <div class="left-actions">
              <button class="pill-btn" onclick="$('file-picker').click()">📷 Snap / Upload</button>
              <button class="pill-btn" onclick="fillPrompt('Test me on Rotational Motion')">⚡ Mechanics</button>
              <button class="pill-btn" onclick="fillPrompt('Explain SN1 vs SN2 reaction traps')">🧪 Organic</button>
            </div>
            <button class="submit-btn disabled" id="submit-trigger" onclick="submitMessage()">➔</button>
          </div>
        </div>
        
        <div class="quick-picks">
          <button class="quick-chip" onclick="fillPrompt('Give me a 5-question mock test on Electrostatics')">🎯 Quick Mock Test</button>
          <button class="quick-chip" onclick="fillPrompt('Shortest distance between two skew lines formula proof')">📐 3D Geometry</button>
          <button class="quick-chip" onclick="fillPrompt('Thermodynamics reversible vs irreversible work done')">🔥 Thermo Traps</button>
        </div>
      </div>
    </section>

    <!-- Chat Messages Stream (Initially Hidden) -->
    <section id="chat-stage" class="hidden"></section>

    <!-- Persistent Bottom Bar when chatting -->
    <div id="bottom-bar" class="hidden"></div>
  </main>

  <!-- Slide-In Test Sandbox -->
  <aside id="test-drawer">
    <div class="td-head">
      <b id="test-title">JEE Practice Drill</b>
      <span class="td-timer" id="test-clock">15:00</span>
      <button class="icon-btn" onclick="closeTestDrawer()" style="width:34px;height:34px">✕</button>
    </div>
    <div id="test-body"></div>
    <div style="padding:16px;border-top:1px solid var(--gb);display:flex;justify-content:space-between;align-items:center">
      <span id="test-progress-label" style="font-size:13px;color:var(--mu)">0 / 0 Answered</span>
      <button class="pill-btn active" onclick="evaluateTest()">Submit Test</button>
    </div>
  </aside>
</div>

<script>
const $ = id => document.getElementById(id);
const home = $('home-stage'), chat = $('chat-stage'), input = $('user-textarea'), sendBtn = $('submit-trigger');
let currentChat = null, sessions = [], attachedFile = null, testTimer = null;

// Formula Formatter (KaTeX)
function renderMath(t) {
  if (typeof katex === 'undefined') return t;
  let o = t.replace(/\$\$([\s\S]+?)\$\$/g, (m, f) => {
    try { return `<div style="overflow-x:auto;padding:6px 0">${katex.renderToString(f.trim(), {displayMode:true, throwOnError:false})}</div>`; } catch{ return m; }
  });
  return o.replace(/\$([^\$\n]+?)\$/g, (m, f) => {
    try { return katex.renderToString(f, {displayMode:false, throwOnError:false}); } catch{ return m; }
  });
}

function toggleSidebar() { $('sidebar').classList.toggle('open'); }

function startFreshChat() {
  currentChat = 'jee_' + Date.now();
  chat.innerHTML = '';
  home.classList.remove('hidden');
  chat.classList.add('hidden');
  $('bottom-bar').classList.add('hidden');
  closeTestDrawer();
  updateHistory();
}

function updateHistory() {
  const h = $('history');
  h.innerHTML = '';
  sessions.forEach(s => {
    const el = document.createElement('div');
    el.className = 'hist-item' + (s.id === currentChat ? ' active' : '');
    el.innerHTML = `<span>${s.title}</span><span class="del" onclick="deleteSession('${s.id}', event)">✕</span>`;
    el.onclick = () => switchSession(s.id);
    h.appendChild(el);
  });
}

function deleteSession(id, ev) {
  ev.stopPropagation();
  sessions = sessions.filter(s => s.id !== id);
  if (currentChat === id) startFreshChat(); else updateHistory();
}

function switchSession(id) {
  currentChat = id;
  updateHistory();
  home.classList.add('hidden');
  chat.classList.remove('hidden');
  $('bottom-bar').classList.remove('hidden');
  attachComposerToBottom();
}

function fillPrompt(p) {
  input.value = p;
  submitMessage();
}

function onFilePicked() {
  const f = $('file-picker').files[0];
  if(f) {
    attachedFile = f;
    input.placeholder = `Attached: ${f.name}. Ask your doubt…`;
    sendBtn.classList.remove('disabled');
  }
}

input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 140) + 'px';
  sendBtn.classList.toggle('disabled', !input.value.trim() && !attachedFile);
});

input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submitMessage(); }
});

function attachComposerToBottom() {
  const hub = document.querySelector('.hero-input-hub');
  if (hub && $('bottom-bar').children.length === 0) {
    $('bottom-bar').appendChild(hub);
  }
}

async function submitMessage() {
  const text = input.value.trim();
  if(!text && !attachedFile) return;

  // Switch from Home to Chat View seamlessly
  home.classList.add('hidden');
  chat.classList.remove('hidden');
  $('bottom-bar').classList.remove('hidden');
  attachComposerToBottom();

  // Add User Message
  appendBubble(text || 'Attached Question/Diagram', 'user');
  input.value = ''; input.style.height = 'auto';
  sendBtn.classList.add('disabled');

  // Dynamic Island: State -> Thinking
  $('island').classList.add('busy');
  $('island-text').textContent = 'Solving step by step…';

  if (!sessions.find(s => s.id === currentChat)) {
    sessions.unshift({ id: currentChat, title: text.slice(0, 26) || 'JEE Doubt' });
    updateHistory();
  }

  const fd = new FormData();
  fd.append('name', currentChat);
  fd.append('interest', text);
  fd.append('followup', text);
  if (attachedFile) fd.append('file', attachedFile);
  attachedFile = null;
  input.placeholder = "Ask Nino anything…";

  try {
    const res = await fetch('/guide', { method: 'POST', body: fd });
    const data = await res.json();
    
    // Dynamic Island: Back to Idle
    $('island').classList.remove('busy');
    $('island-text').textContent = 'Nino · Ready for your doubt';

    if (data.isTestTrigger && data.questions) {
      launchTest(data.testTitle || 'JEE Mock Drill', data.questions);
    }
    appendBubble(data.response || data.chatResponse || 'Solution prepared.', 'ai');
  } catch(err) {
    $('island').classList.remove('busy');
    $('island-text').textContent = 'Connection error';
    appendBubble('Unable to reach AI tutor. Check your internet or local server.', 'ai');
  }
}

function appendBubble(content, role) {
  const b = document.createElement('div');
  b.className = `msg ${role}`;
  if (role === 'ai') {
    b.innerHTML = `
      <div class="avatar">⚡</div>
      <div class="ai-content">${marked.parse(renderMath(content))}</div>
    `;
  } else {
    b.innerHTML = `<div class="bubble">${content}</div>`;
  }
  chat.appendChild(b);
  chat.scrollTop = chat.scrollHeight;
}

// Minimal Test Slide-In
let activeQuestions = [];
function launchTest(title, questions) {
  activeQuestions = questions.map(q => ({ ...q, sel: null }));
  $('test-title').textContent = title;
  $('test-drawer').classList.add('open');
  renderQuestions();
  startTimer(15 * 60);
}

function closeTestDrawer() {
  clearInterval(testTimer);
  $('test-drawer').classList.remove('open');
}

function renderQuestions() {
  const b = $('test-body');
  b.innerHTML = '';
  activeQuestions.forEach((q, qi) => {
    const d = document.createElement('div');
    d.className = 'test-q-card';
    d.innerHTML = `
      <div style="font-weight:700;margin-bottom:8px">Q${qi+1}. ${renderMath(q.question)}</div>
      <div>
        ${q.options.map((opt, oi) => `
          <div class="td-opt ${q.sel === oi ? 'selected' : ''}" onclick="selectOpt(${qi}, ${oi})">
            <b>${String.fromCharCode(65+oi)}.</b> <span>${renderMath(opt)}</span>
          </div>
        `).join('')}
      </div>
    `;
    b.appendChild(d);
  });
  const answered = activeQuestions.filter(q => q.sel !== null).length;
  $('test-progress-label').textContent = `${answered} / ${activeQuestions.length} Answered`;
}

function selectOpt(qi, oi) {
  activeQuestions[qi].sel = activeQuestions[qi].sel === oi ? null : oi;
  renderQuestions();
}

function startTimer(s) {
  clearInterval(testTimer);
  let rem = s;
  const tick = () => {
    const m = Math.floor(rem / 60), sec = rem % 60;
    $('test-clock').textContent = `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
    if (rem <= 0) { clearInterval(testTimer); evaluateTest(); }
    rem--;
  };
  tick(); testTimer = setInterval(tick, 1000);
}

function evaluateTest() {
  clearInterval(testTimer);
  let correct = 0;
  activeQuestions.forEach(q => { if(q.sel === q.correct) correct++; });
  alert(`Test Completed! Score: ${correct} / ${activeQuestions.length}`);
  closeTestDrawer();
}

window.addEventListener('DOMContentLoaded', startFreshChat);
</script>
