<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Nino — JEE Mentor & Practice Arena</title>
  <link rel="stylesheet" href="[https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css](https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css)" />
  <script defer src="[https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js](https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js)"></script>
  <script src="[https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js](https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js)"></script>
  <style>
    :root {
      --bg: #0b0d12;
      --surface: #131722;
      --surface-2: #1a2030;
      --border: rgba(255, 255, 255, 0.09);
      --text: #f3f5fa;
      --muted: #98a2b3;
      --accent: #6c8cff;
      --accent-soft: rgba(108, 140, 255, 0.14);
      --green: #30d158;
      --red: #ff453a;
      --amber: #ff9f0a;
      --shadow: 0 12px 36px rgba(0, 0, 0, 0.35);
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    [data-theme="light"] {
      --bg: #f6f8fc;
      --surface: #ffffff;
      --surface-2: #eef2f9;
      --border: rgba(15, 23, 42, 0.1);
      --text: #101828;
      --muted: #5b6577;
      --accent: #3b63f6;
      --accent-soft: rgba(59, 99, 246, 0.1);
      --shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    button {
      font: inherit;
      color: inherit;
      background: none;
      border: none;
      cursor: pointer;
      transition: transform 0.18s var(--ease), background 0.2s var(--ease), border-color 0.2s var(--ease), opacity 0.2s var(--ease), box-shadow 0.2s var(--ease);
    }
    button:active { transform: scale(0.97); }

    .app-shell {
      display: flex;
      height: 100dvh;
      width: 100vw;
      position: relative;
    }

    /* Sidebar */
    .sidebar {
      width: 268px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 14px;
      gap: 12px;
      transition: transform 0.28s var(--ease), margin-left 0.28s var(--ease);
      z-index: 30;
    }
    .sidebar.collapsed { margin-left: -268px; }
    .brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 6px;
    }
    .brand-left { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.05rem; }
    .logo-badge {
      width: 30px; height: 30px; border-radius: 9px;
      background: linear-gradient(135deg, var(--accent), #9b6cff);
      display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 0.9rem;
    }

    .new-chat-btn {
      width: 100%;
      padding: 10px 12px;
      border-radius: 12px;
      background: var(--accent-soft);
      border: 1px solid rgba(108, 140, 255, 0.28);
      color: var(--accent);
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .new-chat-btn:hover {
      background: var(--accent);
      color: #fff;
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(108, 140, 255, 0.28);
    }

    .chat-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding-right: 2px;
    }
    .chat-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 10px;
      border-radius: 10px;
      font-size: 0.88rem;
      color: var(--muted);
      cursor: pointer;
      transition: background 0.18s var(--ease), color 0.18s var(--ease);
    }
    .chat-item:hover { background: var(--surface-2); color: var(--text); }
    .chat-item.active { background: var(--surface-2); color: var(--text); font-weight: 600; }
    .chat-item-title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
    }
    .del-chat-btn {
      opacity: 0;
      padding: 4px 6px;
      border-radius: 6px;
      color: var(--muted);
      font-size: 0.85rem;
    }
    .chat-item:hover .del-chat-btn, .chat-item.active .del-chat-btn { opacity: 1; }
    .del-chat-btn:hover { background: rgba(255, 69, 58, 0.16); color: var(--red); }

    .sidebar-footer {
      border-top: 1px solid var(--border);
      padding-top: 10px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .foot-btn {
      padding: 8px 10px;
      border-radius: 10px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      font-size: 0.84rem;
      font-weight: 500;
    }
    .foot-btn:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-1px); }

    /* Workspace Split */
    .workspace {
      flex: 1;
      display: flex;
      min-width: 0;
      position: relative;
      overflow: hidden;
    }

    .chat-pane {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      position: relative;
      transition: width 0.3s var(--ease);
    }

    .topbar {
      height: 54px;
      padding: 0 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg);
      z-index: 10;
    }
    .topbar-left { display: flex; align-items: center; gap: 10px; }
    .icon-btn {
      width: 36px; height: 36px;
      border-radius: 10px;
      display: grid; place-items: center;
      border: 1px solid var(--border);
      background: var(--surface);
    }
    .icon-btn:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-1px); }

    .mobile-return-btn {
      display: none;
      padding: 6px 12px;
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
      font-size: 0.82rem;
      font-weight: 600;
    }
    .mobile-return-btn.show { display: inline-flex; align-items: center; gap: 6px; }

    /* Welcome Screen */
    .welcome {
      position: absolute;
      inset: 54px 0 92px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      pointer-events: auto;
      transition: opacity 0.3s var(--ease), transform 0.3s var(--ease);
      z-index: 5;
    }
    .welcome.hidden { opacity: 0; transform: translateY(-10px); pointer-events: none; }
    .welcome-bg-word {
      font-size: clamp(3.2rem, 9vw, 6.2rem);
      font-weight: 900;
      letter-spacing: -0.04em;
      background: linear-gradient(135deg, var(--accent), #b17bff 60%, var(--text));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.05;
      margin-bottom: 10px;
    }
    .welcome p { color: var(--muted); max-width: 480px; font-size: 0.98rem; margin-bottom: 22px; }
    .starter-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      max-width: 640px;
    }
    .starter-chip {
      padding: 10px 14px;
      border-radius: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      font-size: 0.86rem;
      color: var(--text);
    }
    .starter-chip:hover {
      border-color: var(--accent);
      background: var(--accent-soft);
      transform: translateY(-2px);
    }

    /* Chat Stream */
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px 18px 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }
    .msg {
      display: flex;
      gap: 12px;
      max-width: 820px;
      width: 100%;
      margin: 0 auto;
      animation: fadeUp 0.22s var(--ease);
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .msg.user { justify-content: flex-end; }
    .user-bubble {
      max-width: 78%;
      background: var(--accent);
      color: #fff;
      padding: 11px 15px;
      border-radius: 16px 16px 4px 16px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
      box-shadow: 0 6px 20px rgba(108, 140, 255, 0.22);
    }
    .user-bubble img {
      display: block;
      max-width: 240px;
      border-radius: 10px;
      margin-bottom: 8px;
    }

    .mark { flex-shrink: 0; margin-top: 2px; }
    .ai-text {
      flex: 1;
      min-width: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px 16px 16px 16px;
      padding: 14px 16px;
      line-height: 1.65;
      font-size: 0.95rem;
      overflow-x: auto;
    }
    .ai-text p { margin-bottom: 10px; }
    .ai-text p:last-child { margin-bottom: 0; }
    .ai-text ul, .ai-text ol { padding-left: 20px; margin-bottom: 10px; }
    .ai-text li { margin-bottom: 4px; }
    .ai-text code {
      background: var(--surface-2);
      padding: 2px 6px;
      border-radius: 6px;
      font-size: 0.88em;
    }
    .ai-text pre {
      background: var(--surface-2);
      padding: 12px;
      border-radius: 10px;
      overflow-x: auto;
      margin: 10px 0;
    }
    .ai-text pre code { background: none; padding: 0; }

    .svg-card {
      margin: 12px 0;
      padding: 14px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      display: flex;
      justify-content: center;
      overflow-x: auto;
    }
    .svg-card svg { max-width: 100%; height: auto; color: var(--text); }

    .thinking {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      color: var(--muted);
      font-size: 0.9rem;
    }
    .thinking i {
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--accent);
      display: inline-block;
      animation: pulse 1.1s infinite ease-in-out;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(0.75); opacity: 0.45; }
      50% { transform: scale(1.15); opacity: 1; }
    }

    .reopen-test-btn {
      margin-top: 10px;
      padding: 8px 14px;
      border-radius: 10px;
      background: var(--accent-soft);
      border: 1px solid rgba(108, 140, 255, 0.35);
      color: var(--accent);
      font-weight: 600;
      font-size: 0.85rem;
    }
    .reopen-test-btn:hover { background: var(--accent); color: #fff; }

    /* Composer */
    .composer-wrap {
      padding: 10px 16px 16px;
      background: linear-gradient(to top, var(--bg) 75%, transparent);
    }
    .file-preview {
      max-width: 820px;
      margin: 0 auto 8px;
      display: none;
      align-items: center;
      gap: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px 12px;
      font-size: 0.85rem;
    }
    .file-preview.show { display: flex; }
    .file-preview span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .gw {
      max-width: 820px;
      margin: 0 auto;
      display: flex;
      align-items: flex-end;
      gap: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 8px 10px;
      box-shadow: var(--shadow);
      transition: border-color 0.2s var(--ease);
    }
    .gw:focus-within { border-color: var(--accent); }
    #input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font: inherit;
      font-size: 0.96rem;
      line-height: 1.45;
      max-height: 150px;
      resize: none;
      padding: 6px 4px;
    }
    #send-btn {
      width: 40px; height: 40px;
      border-radius: 12px;
      background: var(--accent);
      color: #fff;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }
    #send-btn:hover:not(.off) { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(108, 140, 255, 0.35); }
    #send-btn.off { opacity: 0.4; pointer-events: none; }

    /* Stop generating button while streaming */
    .gw.busy #send-btn {
      opacity: 1;
      pointer-events: auto;
      filter: none;
      background: var(--red);
      box-shadow: 0 4px 16px rgba(255, 69, 58, 0.35);
    }
    .gw.busy #send-btn svg { display: none; }
    .gw.busy #send-btn:after {
      content: "";
      width: 14px;
      height: 14px;
      border-radius: 3px;
      background: #fff;
    }
    .gw.nudge { animation: nudge 0.38s var(--ease); }
    @keyframes nudge {
      20% { transform: translateX(-6px); }
      45% { transform: translateX(5px); }
      70% { transform: translateX(-3px); }
    }

    /* Practice Test Split Pane */
    .test-section {
      width: 0;
      overflow: hidden;
      background: var(--surface);
      border-left: 1px solid transparent;
      display: flex;
      flex-direction: column;
      transition: width 0.32s var(--ease), transform 0.32s var(--ease);
    }
    .test-section.shown {
      width: 50%;
      border-left-color: var(--border);
    }
    .test-header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .test-header h2 { font-size: 1rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .test-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .q-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
    }
    .q-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 0.82rem;
      color: var(--muted);
    }
    .q-badge {
      padding: 3px 9px;
      border-radius: 999px;
      background: var(--surface-2);
      font-weight: 600;
    }
    .q-stem { margin-bottom: 14px; line-height: 1.6; font-size: 0.95rem; }
    .opt-list { display: flex; flex-direction: column; gap: 8px; }
    .opt-btn {
      width: 100%;
      text-align: left;
      padding: 11px 13px;
      border-radius: 11px;
      background: var(--surface);
      border: 1px solid var(--border);
      display: flex;
      align-items: flex-start;
      gap: 10px;
      line-height: 1.45;
    }
    .opt-btn:hover { border-color: var(--accent); background: var(--accent-soft); }
    .opt-btn.selected { border-color: var(--accent); background: var(--accent-soft); }
    .opt-btn.correct { border-color: var(--green); background: rgba(48, 209, 88, 0.14); }
    .opt-btn.wrong { border-color: var(--red); background: rgba(255, 69, 58, 0.14); }
    .opt-letter { font-weight: 700; color: var(--accent); flex-shrink: 0; }

    .q-actions {
      margin-top: 12px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .small-btn {
      padding: 7px 12px;
      border-radius: 9px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      font-size: 0.82rem;
      font-weight: 600;
    }
    .small-btn:hover { border-color: var(--accent); color: var(--accent); }
    .q-sol-box {
      margin-top: 10px;
      padding: 12px;
      border-radius: 10px;
      background: var(--surface-2);
      font-size: 0.88rem;
      line-height: 1.55;
      display: none;
    }
    .q-sol-box.show { display: block; }

    .test-footer {
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .primary-btn {
      padding: 10px 18px;
      border-radius: 11px;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      font-size: 0.9rem;
    }
    .primary-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(108, 140, 255, 0.35); }

    /* Modals */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.58);
      backdrop-filter: blur(4px);
      display: none;
      place-items: center;
      z-index: 60;
      padding: 16px;
    }
    .modal-backdrop.open { display: grid; }
    .modal {
      width: 100%;
      max-width: 440px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .modal h3 { font-size: 1.05rem; }
    .field { display: flex; flex-direction: column; gap: 6px; font-size: 0.86rem; color: var(--muted); }
    .field input, .field select, .field textarea {
      width: 100%;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      font: inherit;
    }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }

    /* Mobile Responsive */
    @media (max-width: 860px) {
      .sidebar {
        position: fixed;
        inset: 0 auto 0 0;
        transform: translateX(-100%);
        margin-left: 0 !important;
      }
      .sidebar.mobile-open { transform: translateX(0); box-shadow: var(--shadow); }
      .test-section {
        position: fixed;
        inset: 0;
        width: 100% !important;
        transform: translateX(100%);
        z-index: 40;
      }
      .test-section.shown { transform: translateX(0); }
    }
  </style>
</head>
<body>
<div class="app-shell">
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-left">
        <span class="logo-badge">N</span>
        <span>Nino JEE</span>
      </div>
      <button class="icon-btn" id="theme-btn" title="Toggle theme" aria-label="Toggle theme">◐</button>
    </div>
    <button class="new-chat-btn" id="new-chat-btn">+ New Chat</button>
    <div class="chat-list" id="chat-list"></div>
    <div class="sidebar-footer">
      <button class="foot-btn" id="open-settings-btn">Settings</button>
      <button class="foot-btn" id="open-feedback-btn">Feedback</button>
    </div>
  </aside>

  <!-- Main Workspace -->
  <div class="workspace">
    <main class="chat-pane" id="chat-pane">
      <header class="topbar">
        <div class="topbar-left">
          <button class="icon-btn" id="toggle-sidebar-btn" aria-label="Menu">☰</button>
          <span style="font-weight:600;font-size:.95rem">Nino</span>
        </div>
        <button class="mobile-return-btn" id="mobile-return-btn">Return to Test</button>
      </header>

      <section class="welcome" id="welcome">
        <div class="welcome-bg-word">Meet Nino</div>
        <p>JEE Advanced doubt solver &amp; original mock-test generator. Ask a tough question, upload a problem photo, or launch a timed set.</p>
        <div class="starter-grid">
          <button class="starter-chip" data-prompt="Give me a 4 question JEE Physics test on Magnetism">4Q Physics: Magnetism</button>
          <button class="starter-chip" data-prompt="Create a 3 question JEE Organic Chemistry test">3Q Organic Chemistry</button>
          <button class="starter-chip" data-prompt="Generate a 6 question Mixed PCM test">6Q Mixed PCM Challenge</button>
          <button class="starter-chip" data-prompt="Give me a 4 question Mechanics test">4Q Mechanics Drill</button>
        </div>
      </section>

      <div id="chat"></div>

      <div class="composer-wrap">
        <div class="file-preview" id="file-preview">
          <span id="file-name"></span>
          <button class="small-btn" id="clear-file-btn">Remove</button>
        </div>
        <div class="gw" id="glow">
          <input type="file" id="file-input" accept="image/png,image/jpeg,image/webp,application/pdf" hidden />
          <button class="icon-btn" id="attach-btn" title="Upload problem image or PDF" aria-label="Attach file">+</button>
          <textarea id="input" rows="1" placeholder="Ask a JEE doubt, paste a question, or request a mock test..."></textarea>
          <button id="send-btn" class="off" aria-label="Send">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="19" x2="12" y2="5"></line>
              <polyline points="5 12 12 5 19 12"></polyline>
            </svg>
          </button>
        </div>
      </div>
    </main>

    <!-- Split Practice Test Panel -->
    <aside class="test-section" id="test-section">
      <div class="test-header">
        <h2 id="test-title">Practice Test</h2>
        <button class="icon-btn" id="close-test-btn" aria-label="Close test">✕</button>
      </div>
      <div class="test-body" id="test-body"></div>
      <div class="test-footer">
        <span id="test-score" style="font-size:.88rem;color:var(--muted)">Select your answers</span>
        <div style="display:flex;gap:8px">
          <button class="small-btn" id="analyze-btn" style="display:none">Analyze Mistakes</button>
          <button class="primary-btn" id="submit-test-btn">Submit Test</button>
        </div>
      </div>
    </aside>
  </div>
</div>

<!-- Settings Modal -->
<div class="modal-backdrop" id="settings-modal">
  <div class="modal">
    <h3>Settings</h3>
    <label class="field">
      Your Gemini API Key (optional — bypasses daily free limit)
      <input type="password" id="api-key-input" placeholder="AIza..." />
    </label>
    <div class="modal-actions">
      <button class="small-btn" id="close-settings-btn">Cancel</button>
      <button class="primary-btn" id="save-settings-btn">Save</button>
    </div>
  </div>
</div>

<!-- Feedback Modal -->
<div class="modal-backdrop" id="feedback-modal">
  <div class="modal">
    <h3>Send Feedback</h3>
    <label class="field">
      Category
      <select id="fb-category">
        <option value="wrong_answer">Wrong answer / Math error</option>
        <option value="bug">UI / App bug</option>
        <option value="idea">Feature idea</option>
        <option value="other">Other</option>
      </select>
    </label>
    <label class="field">
      Rating (1–5)
      <input type="number" id="fb-rating" min="1" max="5" value="5" />
    </label>
    <label class="field">
      Details
      <textarea id="fb-message" rows="3" placeholder="Tell Mayank what happened..."></textarea>
    </label>
    <div class="modal-actions">
      <button class="small-btn" id="close-fb-btn">Cancel</button>
      <button class="primary-btn" id="send-fb-btn">Submit</button>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const chat = $('chat');
const input = $('input');
const sendBtn = $('send-btn');
const glow = $('glow');
const welcome = $('welcome');
const sidebar = $('sidebar');
const chatListEl = $('chat-list');
const testSection = $('test-section');
const testBody = $('test-body');
const testTitleEl = $('test-title');
const testScoreEl = $('test-score');
const submitTestBtn = $('submit-test-btn');
const analyzeBtn = $('analyze-btn');
const mobileReturnBtn = $('mobile-return-btn');
const fileInput = $('file-input');
const filePreview = $('file-preview');
const fileNameEl = $('file-name');

const LOGO = '<span class="logo-badge" style="width:26px;height:26px;font-size:.78rem">N</span>';
const USER_KEY_STORAGE = 'nino_user_gemini_key';
const THEME_STORAGE = 'nino_theme';
const CHATS_STORAGE = 'helper_buddy_chats';
const MSG_CACHE_PREFIX = 'nino_msgs_';

let chatSessions = JSON.parse(localStorage.getItem(CHATS_STORAGE) || '[]');
let currentChatId = 'chat_' + Date.now();
let currentMessages = [];
let selectedFileObject = null;
let verificationQuestions = [];
let currentTestTitle = '';
let testSubmitted = false;
let activeStreamController = null;
let stopCurrentStream = null;

const isMobile = () => window.innerWidth <= 860;

// Theme initialization
function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  localStorage.setItem(THEME_STORAGE, theme);
}
applyTheme(localStorage.getItem(THEME_STORAGE) || 'dark');

function showWelcome(flag) {
  welcome.classList.toggle('hidden', !flag);
}
function scrollEnd() {
  chat.scrollTop = chat.scrollHeight;
}
function autoGrow() {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 150) + 'px';
}
function updateSendState() {
  const isBusy = glow.classList.contains('busy');
  sendBtn.classList.toggle('off', !isBusy && !input.value.trim() && !selectedFileObject);
  sendBtn.setAttribute('aria-label', isBusy ? 'Stop generating' : 'Send');
}
function clearSelectedFile() {
  selectedFileObject = null;
  fileInput.value = '';
  filePreview.classList.remove('show');
  updateSendState();
}
function normMistake(m) {
  const v = String(m || 'Concept').toLowerCase();
  if (v.includes('formula')) return 'Formula';
  if (v.includes('silly')) return 'Silly';
  return 'Concept';
}

// Local message cache so Vercel cold starts never wipe visible history
function saveLocalMessages() {
  try {
    localStorage.setItem(MSG_CACHE_PREFIX + currentChatId, JSON.stringify(currentMessages.slice(-40)));
  } catch {}
}
function loadLocalMessages(id) {
  try {
    return JSON.parse(localStorage.getItem(MSG_CACHE_PREFIX + id) || '[]');
  } catch { return []; }
}

// Safe KaTeX + Marked + SVG renderer (protects LaTeX from Marked underscore mangling)
function renderRichAI(text, streaming = false) {
  let t = String(text || '').replace(/```(?:xml|html|svg)?\s*(<svg[\s\S]*?<\/svg>)\s*```/gi, '$1');
  if (streaming) {
    t = t.replace(/<svg(?![\s\S]*<\/svg>)[\s\S]*$/i, '\n\n*Drawing diagram...*');
  }
  const svgs = [];
  t = t.replace(/<svg[\s\S]*?<\/svg>/gi, m => {
    svgs.push(m);
    return `%%%SVG_${svgs.length - 1}%%%`;
  });

  const maths = [];
  const renderTex = (expr, displayMode) => {
    if (window.katex) {
      try {
        return katex.renderToString(expr.trim(), { displayMode, throwOnError: false });
      } catch {}
    }
    return displayMode ? `$$${expr}$$` : `$${expr}$`;
  };
  t = t.replace(/\$\$([\s\S]+?)\$\$/g, (_, expr) => {
    maths.push(renderTex(expr, true));
    return `%%%MATH_${maths.length - 1}%%%`;
  });
  t = t.replace(/(?<!\\)\$([^\$\n]+?)\$/g, (_, expr) => {
    maths.push(renderTex(expr, false));
    return `%%%MATH_${maths.length - 1}%%%`;
  });

  let h = window.marked ? marked.parse(t) : t.replace(/\n/g, '<br>');
  maths.forEach((m, i) => {
    h = h.replace(new RegExp(`%%%MATH_${i}%%%`, 'g'), m);
  });
  svgs.forEach((s, i) => {
    const safe = s
      .replace(/stroke="black"/gi, 'stroke="currentColor"')
      .replace(/fill="black"/gi, 'fill="currentColor"');
    h = h.replace(
      new RegExp(`<p>%%%SVG_${i}%%%</p>|%%%SVG_${i}%%%`, 'g'),
      `<div class="svg-card">${safe}</div>`
    );
  });
  return h;
}

function addMessage(content, role, skipSave = false, imgUrl = null, testMeta = null) {
  showWelcome(false);
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + (role === 'user' ? 'user' : 'ai');

  if (role === 'user') {
    const bubble = document.createElement('div');
    bubble.className = 'user-bubble';
    if (imgUrl) {
      const img = document.createElement('img');
      img.src = imgUrl;
      bubble.appendChild(img);
    }
    const span = document.createElement('span');
    span.textContent = content || (imgUrl ? '[Uploaded Image]' : '');
    bubble.appendChild(span);
    wrap.appendChild(bubble);
  } else {
    wrap.innerHTML = `<span class="mark">${LOGO}</span><div class="ai-text rich">${renderRichAI(content, false)}</div>`;
    if (testMeta && testMeta.questions && testMeta.questions.length) {
      const btn = document.createElement('button');
      btn.className = 'reopen-test-btn';
      btn.textContent = `Open Test: ${testMeta.title}`;
      btn.onclick = () => {
        verificationQuestions = testMeta.questions.map(q => ({
          ...q,
          selectedAnswer: q.selectedAnswer ?? null,
          mistakeType: normMistake(q.mistakeType),
        }));
        openTestingInterface(testMeta.title);
      };
      wrap.querySelector('.ai-text').appendChild(btn);
    }
  }
  chat.appendChild(wrap);
  scrollEnd();

  if (!skipSave) {
    currentMessages.push({
      role: role === 'user' ? 'user' : 'model',
      content: content || '',
      test: testMeta || undefined,
    });
    saveLocalMessages();
  }
}

// Sidebar rendering & chat deletion
function renderSidebarList() {
  chatListEl.innerHTML = '';
  chatSessions.forEach(c => {
    const item = document.createElement('div');
    item.className = 'chat-item' + (c.id === currentChatId ? ' active' : '');
    const title = document.createElement('span');
    title.className = 'chat-item-title';
    title.textContent = c.title || 'New Chat';
    title.onclick = () => loadChat(c.id);

    const del = document.createElement('button');
    del.className = 'del-chat-btn';
    del.title = 'Delete chat';
    del.textContent = '✕';
    del.onclick = async e => {
      e.stopPropagation();
      chatSessions = chatSessions.filter(x => x.id !== c.id);
      localStorage.setItem(CHATS_STORAGE, JSON.stringify(chatSessions));
      localStorage.removeItem(MSG_CACHE_PREFIX + c.id);
      fetch(`/api/chat/${encodeURIComponent(c.id)}`, { method: 'DELETE' }).catch(() => {});
      if (currentChatId === c.id) startNewChat();
      else renderSidebarList();
    };
    item.append(title, del);
    chatListEl.appendChild(item);
  });
}

function startNewChat() {
  if (stopCurrentStream) stopCurrentStream();
  currentChatId = 'chat_' + Date.now();
  currentMessages = [];
  chat.innerHTML = '';
  showWelcome(true);
  setSplitView(0);
  renderSidebarList();
  if (isMobile()) sidebar.classList.remove('mobile-open');
}

async function loadChat(id) {
  if (stopCurrentStream) stopCurrentStream();
  currentChatId = id;
  chat.innerHTML = '';
  renderSidebarList();
  if (isMobile()) sidebar.classList.remove('mobile-open');

  let msgs = loadLocalMessages(id);
  try {
    const res = await fetch(`/api/chat/${encodeURIComponent(id)}`);
    if (res.ok) {
      const data = await res.json();
      if (Array.isArray(data.history) && data.history.length >= msgs.length) {
        msgs = data.history;
      }
    }
  } catch {}

  currentMessages = msgs;
  if (!msgs.length) {
    showWelcome(true);
    return;
  }
  showWelcome(false);
  msgs.forEach(m => {
    const role = m.role === 'user' ? 'user' : 'ai';
    addMessage(m.content, role, true, null, m.test || null);
  });
}

// Split View & Practice Test Engine
function setSplitView(pct) {
  if (pct > 0) {
    testSection.classList.add('shown');
    mobileReturnBtn.classList.remove('show');
  } else {
    testSection.classList.remove('shown');
  }
}
function showMobileReturnButton() {
  if (verificationQuestions.length) mobileReturnBtn.classList.add('show');
}

function openTestingInterface(title) {
  currentTestTitle = title || 'Practice Test';
  testTitleEl.textContent = currentTestTitle;
  testSubmitted = false;
  submitTestBtn.style.display = 'inline-block';
  analyzeBtn.style.display = 'none';
  testScoreEl.textContent = `${verificationQuestions.length} questions`;
  renderTestQuestions();
  setSplitView(50);
}

function renderTestQuestions() {
  testBody.innerHTML = '';
  verificationQuestions.forEach(q => {
    const card = document.createElement('div');
    card.className = 'q-card';
    card.innerHTML = `
      <div class="q-top">
        <strong>Question ${q.id}</strong>
        <span class="q-badge">${q.mistakeType || 'Concept'}</span>
      </div>
      <div class="q-stem">${renderRichAI(q.question, false)}</div>
      <div class="opt-list"></div>
      <div class="q-actions">
        <button class="small-btn explain-btn">Explain step-by-step</button>
        ${q.solution ? '<button class="small-btn sol-toggle-btn" style="display:none">Quick Key</button>' : ''}
      </div>
      ${q.solution ? `<div class="q-sol-box">${renderRichAI(q.solution, false)}</div>` : ''}
    `;

    const optList = card.querySelector('.opt-list');
    (q.options || []).forEach((opt, idx) => {
      const btn = document.createElement('button');
      btn.className = 'opt-btn';
      if (q.selectedAnswer === idx) btn.classList.add('selected');
      if (testSubmitted) {
        if (idx === q.correct) btn.classList.add('correct');
        else if (q.selectedAnswer === idx && idx !== q.correct) btn.classList.add('wrong');
      }
      btn.innerHTML = `<span class="opt-letter">${String.fromCharCode(65 + idx)})</span><span>${renderRichAI(opt, false)}</span>`;
      btn.onclick = () => {
        if (testSubmitted) return;
        q.selectedAnswer = idx;
        renderTestQuestions();
      };
      optList.appendChild(btn);
    });

    card.querySelector('.explain-btn').onclick = () => requestRealtimeDoubtSupport(q.id);
    const solToggle = card.querySelector('.sol-toggle-btn');
    if (solToggle) {
      if (testSubmitted) solToggle.style.display = 'inline-block';
      solToggle.onclick = () => card.querySelector('.q-sol-box').classList.toggle('show');
    }
    testBody.appendChild(card);
  });
}

// FIXED: Passes all 4 options and requests complete step-by-step derivation (no forced SVG)
function requestRealtimeDoubtSupport(id) {
  if (isMobile()) {
    testSection.classList.remove('shown');
    showMobileReturnButton();
  } else {
    setSplitView(50);
  }
  const q = verificationQuestions.find(x => x.id === id);
  if (q) {
    const opts = (q.options || [])
      .map((o, i) => `${String.fromCharCode(65 + i)}) ${o}`)
      .join('\n');
    input.value = `I need the complete step-by-step solution for Question ${id}:\n\n"${q.question}"\n\nOptions:\n${opts}`;
    autoGrow();
    updateSendState();
    setTimeout(() => {
      chat.scrollTop = chat.scrollHeight;
      input.focus({ preventScroll: true });
    }, isMobile() ? 350 : 0);
  }
}

submitTestBtn.onclick = () => {
  if (!verificationQuestions.length) return;
  testSubmitted = true;
  let score = 0;
  verificationQuestions.forEach(q => {
    if (q.selectedAnswer === q.correct) score++;
  });
  testScoreEl.textContent = `Score: ${score} / ${verificationQuestions.length}`;
  submitTestBtn.style.display = 'none';
  analyzeBtn.style.display = 'inline-block';
  renderTestQuestions();
};

analyzeBtn.onclick = () => {
  const wrong = verificationQuestions.filter(q => q.selectedAnswer !== q.correct);
  const summary = wrong.map(q => {
    const picked = q.selectedAnswer !== null ? String.fromCharCode(65 + q.selectedAnswer) : 'Skipped';
    const ans = String.fromCharCode(65 + q.correct);
    return `Q${q.id} (${q.mistakeType}): "${q.question}" | Picked: ${picked}, Correct: ${ans}`;
  }).join('\n');
  if (isMobile()) { testSection.classList.remove('shown'); showMobileReturnButton(); }
  input.value = wrong.length
    ? `Diagnostic Evaluation Completed for "${currentTestTitle}". Analyze my mistakes:\n${summary}`
    : `Diagnostic Evaluation Completed for "${currentTestTitle}" — I got all ${verificationQuestions.length} right! Give me a tougher next step.`;
  autoGrow();
  updateSendState();
  send();
};

// Streaming Word-by-Word Send + Stop Generating
async function send() {
  if (glow.classList.contains('busy')) {
    if (stopCurrentStream) stopCurrentStream();
    else if (activeStreamController) activeStreamController.abort();
    return;
  }

  const text = input.value.trim();
  if (!text && !selectedFileObject) return;
  const file = selectedFileObject;
  input.value = '';
  input.style.height = 'auto';
  showWelcome(false);

  const imgUrl = file && file.type && file.type.startsWith('image/') ? URL.createObjectURL(file) : null;
  const historyForServer = currentMessages.slice(-10).map(m => ({ role: m.role, content: m.content }));
  addMessage(text, 'user', false, imgUrl);
  clearSelectedFile();

  if (!chatSessions.find(c => c.id === currentChatId)) {
    let title = text.substring(0, 28) + (text.length > 28 ? '...' : '');
    if (!text && imgUrl) title = 'Image Doubt';
    chatSessions.unshift({ id: currentChatId, title, date: Date.now() });
    localStorage.setItem(CHATS_STORAGE, JSON.stringify(chatSessions));
    renderSidebarList();
  }

  const tId = 'think-' + Date.now();
  const t = document.createElement('div');
  t.id = tId;
  t.className = 'msg ai';
  t.innerHTML = `<span class="mark">${LOGO}</span><div class="ai-text"><div class="thinking"><i></i>Nino is thinking...</div></div>`;
  chat.appendChild(t);
  scrollEnd();

  glow.classList.add('busy');
  updateSendState();

  activeStreamController = new AbortController();
  let drainTimer = null;
  let aiBody = null;
  let displayed = '';
  let savedStreamReply = false;

  stopCurrentStream = () => {
    if (drainTimer) { clearInterval(drainTimer); drainTimer = null; }
    if (activeStreamController) activeStreamController.abort();
    if (aiBody && displayed.trim()) {
      aiBody.innerHTML = renderRichAI(displayed, false);
      if (!savedStreamReply) {
        savedStreamReply = true;
        currentMessages.push({ role: 'model', content: displayed });
        saveLocalMessages();
      }
    } else {
      $(tId)?.remove();
    }
  };

  try {
    const fd = new FormData();
    fd.append('name', currentChatId);
    fd.append('interest', text || 'General Study Optimization');
    fd.append('followup', text);
    fd.append('history', JSON.stringify(historyForServer));
    if (file) fd.append('file', file);

    const headers = {};
    const uk = localStorage.getItem(USER_KEY_STORAGE);
    if (uk) headers['X-User-Key'] = uk;

    const res = await fetch('/guide', {
      method: 'POST',
      body: fd,
      headers,
      signal: activeStreamController.signal,
    });

    const contentType = res.headers.get('content-type') || '';

    // Path 1: SSE Word-by-Word Stream
    if (contentType.includes('text/event-stream') && res.body) {
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let sseBuffer = '';
      let wordQueue = [];
      let fullText = '';
      let streamDone = false;

      const nearBottom = () => (chat.scrollHeight - chat.scrollTop - chat.clientHeight) < 140;
      const ensureBubble = () => {
        if (aiBody) return;
        const wrap = $(tId);
        if (wrap) {
          aiBody = wrap.querySelector('.ai-text');
          aiBody.classList.add('rich');
          aiBody.innerHTML = '';
        }
      };

      const startDrain = () => {
        if (drainTimer) return;
        drainTimer = setInterval(() => {
          if (!wordQueue.length) {
            if (streamDone) {
              clearInterval(drainTimer);
              drainTimer = null;
              if (aiBody) aiBody.innerHTML = renderRichAI(fullText, false);
            }
            return;
          }
          const step = wordQueue.length > 60 ? 6 : wordQueue.length > 25 ? 3 : 1;
          for (let i = 0; i < step && wordQueue.length; i++) {
            displayed += wordQueue.shift();
          }
          const stick = nearBottom();
          ensureBubble();
          if (aiBody) aiBody.innerHTML = renderRichAI(displayed, !streamDone);
          if (stick) chat.scrollTop = chat.scrollHeight;
        }, 22);
      };

      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        sseBuffer += decoder.decode(value, { stream: true });
        const events = sseBuffer.split('\n\n');
        sseBuffer = events.pop() || '';

        for (const ev of events) {
          const line = ev.trim();
          if (!line.startsWith('data:')) continue;
          let msg;
          try { msg = JSON.parse(line.slice(5).trim()); } catch { continue; }

          if (msg.error) {
            $(tId)?.remove();
            addMessage(msg.error, 'ai');
            streamDone = true;
            return;
          }
          if (msg.token) {
            fullText += msg.token;
            const pieces = msg.token.split(/(\s+)/).filter(Boolean);
            wordQueue.push(...pieces);
            startDrain();
          }
          if (msg.done) streamDone = true;
        }
      }

      streamDone = true;
      await new Promise(resolve => {
        const check = setInterval(() => {
          if (!drainTimer) { clearInterval(check); resolve(); }
        }, 30);
      });

      if (fullText.trim() && !savedStreamReply) {
        savedStreamReply = true;
        currentMessages.push({ role: 'model', content: fullText });
        saveLocalMessages();
      }
      return;
    }

    // Path 2: Standard JSON (Practice tests & rate-limit responses)
    const data = await res.json();
    $(tId)?.remove();
    const trig = data.isTestTrigger || data.IsTestTrigger || data.istesttrigger;
    const qs = data.questions || data.Questions;
    const title = data.testTitle || data.TestTitle || text;

    if (trig && qs && qs.length) {
      const normalized = qs.map(q => ({ ...q, selectedAnswer: null, mistakeType: normMistake(q.mistakeType) }));
      addMessage(
        data.chatResponse || data.ChatResponse || "I've opened your practice test.",
        'ai',
        false,
        null,
        { title, questions: normalized }
      );
      verificationQuestions = normalized;
      openTestingInterface(title);
    } else {
      addMessage(
        data.response || data.chatResponse || data.ChatResponse || "Nino couldn't answer that just now. Try again.",
        'ai'
      );
    }
  } catch (err) {
    if (err && err.name === 'AbortError') return;
    $(tId)?.remove();
    addMessage("### Connection problem\n\nCouldn't reach Nino. Check your internet connection, then send your message again.", 'ai');
  } finally {
    if (drainTimer) { clearInterval(drainTimer); drainTimer = null; }
    activeStreamController = null;
    stopCurrentStream = null;
    glow.classList.remove('busy');
    updateSendState();
  }
}

// Event Wiring
input.addEventListener('input', () => { autoGrow(); updateSendState(); });
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});
sendBtn.addEventListener('click', send);
$('new-chat-btn').addEventListener('click', startNewChat);
$('theme-btn').addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme');
  applyTheme(cur === 'dark' ? 'light' : 'dark');
});
$('toggle-sidebar-btn').addEventListener('click', () => {
  if (isMobile()) sidebar.classList.toggle('mobile-open');
  else sidebar.classList.toggle('collapsed');
});
$('close-test-btn').addEventListener('click', () => {
  setSplitView(0);
  if (isMobile()) showMobileReturnButton();
});
mobileReturnBtn.addEventListener('click', () => setSplitView(50));

$('attach-btn').addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', () => {
  const f = fileInput.files[0];
  if (!f) return;
  selectedFileObject = f;
  fileNameEl.textContent = f.name;
  filePreview.classList.add('show');
  updateSendState();
});
$('clear-file-btn').addEventListener('click', clearSelectedFile);

document.querySelectorAll('.starter-chip').forEach(btn => {
  btn.addEventListener('click', () => {
    input.value = btn.dataset.prompt;
    autoGrow();
    updateSendState();
    send();
  });
});

// Settings Modal
$('open-settings-btn').onclick = () => {
  $('api-key-input').value = localStorage.getItem(USER_KEY_STORAGE) || '';
  $('settings-modal').classList.add('open');
};
$('close-settings-btn').onclick = () => $('settings-modal').classList.remove('open');
$('save-settings-btn').onclick = () => {
  const k = $('api-key-input').value.trim();
  if (k) localStorage.setItem(USER_KEY_STORAGE, k);
  else localStorage.removeItem(USER_KEY_STORAGE);
  $('settings-modal').classList.remove('open');
};

// Feedback Modal
$('open-feedback-btn').onclick = () => $('feedback-modal').classList.add('open');
$('close-fb-btn').onclick = () => $('feedback-modal').classList.remove('open');
$('send-fb-btn').onclick = async () => {
  const payload = {
    category: $('fb-category').value,
    rating: Number($('fb-rating').value || 0),
    message: $('fb-message').value.trim(),
    name: currentChatId,
    screen: `${window.innerWidth}x${window.innerHeight}`,
    theme: document.documentElement.getAttribute('data-theme'),
  };
  await fetch('/api/feedback', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload),
  }).catch(() => {});
  $('fb-message').value = '';
  $('feedback-modal').classList.remove('open');
};

renderSidebarList();
</script>
</body>
</html>
